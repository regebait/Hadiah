<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lihat Foto Lucu Ini!</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: 'Segoe UI', sans-serif;
  height: 100%;
  width: 100%;
}

#overlay {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle, #ff0059, #1a0022);
  z-index: 9999;
  text-align: center;
  padding: 20px;
  animation: flash 0.3s infinite alternate;
}

@keyframes flash {
  from { filter: brightness(1); }
  to   { filter: brightness(1.4); }
}

#warning-text {
  color: #fff;
  font-size: 9vw;
  margin: 0 0 10px 0;
  text-shadow: 0 0 10px red, 0 0 20px yellow;
  animation: shake 0.15s infinite;
}

@keyframes shake {
  0%   { transform: translate(2px, 1px) rotate(0deg); }
  25%  { transform: translate(-2px, -1px) rotate(-2deg); }
  50%  { transform: translate(-1px, 2px) rotate(2deg); }
  75%  { transform: translate(1px, -2px) rotate(0deg); }
  100% { transform: translate(1px, 1px) rotate(2deg); }
}

#sub-text {
  color: #fff;
  font-size: 5vw;
  max-width: 90%;
  line-height: 1.4;
}

#emoji-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.emoji {
  position: absolute;
  font-size: 14vw;
  animation: spin 1.2s linear infinite, floatUp 3.5s ease-in forwards;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

@keyframes floatUp {
  0%   { opacity: 0; bottom: -20vh; }
  15%  { opacity: 1; }
  85%  { opacity: 1; }
  100% { opacity: 0; bottom: 110vh; }
}

#fixed-text {
  color: #00ff88;
  font-size: 7vw;
  text-align: center;
  padding: 20px;
}
</style>
</head>
<body>

  <div id="overlay">
    <div id="emoji-container"></div>
    <h1 id="warning-text">⚠️ SISTEM ERROR ⚠️</h1>
    <p id="sub-text">HP kamu kena virus emoji liar!</p>
  </div>

  <script>
// ===== DAFTAR EMOJI ANEH YANG AKAN MUNCUL =====
const emojiList = ["👽", "🤪", "😱", "🥴", "👹", "🫠", "🐙", "💀", "🤯", "👻"];

const overlay = document.getElementById("overlay");
const container = document.getElementById("emoji-container");

// ===== SPAWN EMOJI ACAK BERTERBANGAN =====
function spawnEmoji() {
  const el = document.createElement("div");
  el.className = "emoji";
  el.textContent = emojiList[Math.floor(Math.random() * emojiList.length)];
  el.style.left = Math.random() * 90 + "vw";
  el.style.animationDuration = (2 + Math.random() * 2) + "s, 3s";
  container.appendChild(el);

  // bersihkan emoji lama biar HP ga berat
  setTimeout(() => el.remove(), 4000);
}

// terus-terusan muncul emoji baru
const spawnInterval = setInterval(spawnEmoji, 250);

// ===== GETAR HP (kalau browser mendukung, biasanya Android Chrome) =====
if (navigator.vibrate) {
  const vibrateInterval = setInterval(() => {
    navigator.vibrate([150, 80, 150]);
  }, 800);

  // simpan supaya bisa dimatikan nanti
  window.__vibrateInterval = vibrateInterval;
}

// ===== COBA MODE FULLSCREEN SAAT DISENTUH PERTAMA KALI =====
document.body.addEventListener(
  "click",
  () => {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  },
  { once: true }
);

// ===== INI KUNCI UTAMA PRANK-NYA (dirahasiakan dari tampilan) =====
// Saat "Mode Pesawat" diaktifkan, koneksi internet HP mati.
// Browser otomatis mendeteksi ini lewat event "offline".
window.addEventListener("offline", () => {
  clearInterval(spawnInterval);
  if (window.__vibrateInterval) clearInterval(window.__vibrateInterval);
  if (navigator.vibrate) navigator.vibrate(0);

  container.innerHTML = "";
  overlay.innerHTML = `
    <h1 id="fixed-text">✅ Berhasil dibersihkan!<br>😂 Kena prank ya~</h1>
  `;

  if (document.fullscreenElement) {
    document.exitFullscreen().catch(() => {});
  }
});
  </script>
</body>
</html>
