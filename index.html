<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selamat!</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffdd00, #ff8c00);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  #card {
    background: #fff;
    border-radius: 20px;
    padding: 30px 25px;
    max-width: 400px;
    width: 90%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    animation: pop 0.4s ease-out;
  }

  @keyframes pop {
    from { transform: scale(0.7); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .trophy { font-size: 60px; animation: bounce 1s infinite; }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  h1 { color: #ff6a00; font-size: 24px; margin: 10px 0; }
  .amount {
    font-size: 32px;
    font-weight: bold;
    color: #16a34a;
    margin: 15px 0;
  }
  p { color: #555; font-size: 15px; }

  #claim-btn {
    margin-top: 15px;
    background: #16a34a;
    color: #fff;
    border: none;
    padding: 14px 30px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(22,163,74,0.4);
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  #claim-btn:disabled {
    opacity: 0.7;
    cursor: default;
    animation: none;
  }

  /* ===== TOAST NOTIFIKASI ===== */
  #toast {
    position: fixed;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    background: #16a34a;
    color: #fff;
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: top 0.4s ease;
    z-index: 1000;
    white-space: nowrap;
  }

  #toast.show { top: 20px; }

  /* ===== SCREEN REVEAL PRANK ===== */
  #prank-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: #111;
    color: #fff;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 999;
    padding: 20px;
  }

  #prank-screen.show { display: flex; }

  #prank-screen h1 {
    color: #ff3b3b;
    font-size: 15vw;
    margin: 0;
    animation: shake 0.15s infinite;
  }

  @keyframes shake {
    0%   { transform: translate(2px, 1px) rotate(0deg); }
    50%  { transform: translate(-2px, -1px) rotate(-2deg); }
    100% { transform: translate(1px, 2px) rotate(2deg); }
  }

  #prank-screen p {
    color: #ddd;
    font-size: 5vw;
    margin-top: 10px;
  }

  .confetti {
    position: absolute;
    top: -10%;
    font-size: 24px;
    animation: fall linear forwards;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0.3; }
  }
</style>
</head>
<body>

  <div id="toast">✅ Data berhasil disimpan</div>

  <div id="card">
    <div class="trophy">🏆</div>
    <h1>SELAMAT!</h1>
    <p>Anda terpilih sebagai pemenang undian hari ini</p>
    <div class="amount">Rp 5.000.000</div>
    <p>Klik tombol di bawah untuk klaim hadiah Anda sekarang</p>
    <button id="claim-btn">🎁 Klaim Sekarang</button>
  </div>

  <div id="prank-screen">
    <h1>ANAK DUDI MANDI!</h1>
    <p>😂 GODANG JANGAN COLI MULU,BAU BANGET MUANI~</p>
  </div>

  <script>
    const claimBtn = document.getElementById("claim-btn");
    const prankScreen = document.getElementById("prank-screen");
    const toast = document.getElementById("toast");

    claimBtn.addEventListener("click", () => {
      // CATATAN: tidak ada data apapun yang benar-benar dikirim/disimpan.
      // Teks di bawah ini murni kosmetik untuk keperluan prank.
      claimBtn.disabled = true;
      claimBtn.textContent = "Memproses...";

      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
        prankScreen.classList.add("show");
        spawnConfetti();
      }, 1500);
    });

    function spawnConfetti() {
      const emojis = ["🎉", "🎊", "😂", "🤡"];
      for (let i = 0; i < 30; i++) {
        setTimeout(() => {
          const el = document.createElement("div");
          el.className = "confetti";
          el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          el.style.left = Math.random() * 100 + "vw";
          el.style.animationDuration = (2 + Math.random() * 2) + "s";
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 4000);
        }, i * 100);
      }
    }
  </script>

</body>
</html>
